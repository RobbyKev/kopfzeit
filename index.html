<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kopfzeit">
<title>Kopfzeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#12121f;--card:#1a1a2c;--card2:#222238;--line:#2e2e4a;--text:#ecebf5;--muted:#9a99b6;--accent:#8fb8ff;--on-accent:#12121f;--ok:#7fd1a8;--bad:#e8a0a0;--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 var(--fs)/1.5 'DM Sans',system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
body.big{--fs:21px}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;margin:0 0 .35em;line-height:1.15}
h1{font-size:2.1em}h2{font-size:1.55em}h3{font-size:1.15em}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)}.small{font-size:.84em}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-weight:500;padding:13px 16px;border-radius:14px;cursor:pointer;width:100%;text-align:center;min-height:54px;transition:transform .08s,background .25s,border-color .25s;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{width:auto;min-height:40px;padding:7px 14px;font-size:.84em}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.38;cursor:default}
.btn.good,.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card2))}
.btn.bad,.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card2))}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}
.row>.btn.sm{flex:none}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;padding:10px 16px;border-radius:999px;cursor:pointer;min-height:48px;touch-action:manipulation}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
.chip small{display:block;font-size:.66em;line-height:1;opacity:.85;margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.icon{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);width:46px;height:46px;border-radius:50%;font-size:1.2em;cursor:pointer}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.backbar h2{margin:0;flex:1}
.dom{display:inline-block;font-size:.72em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dc);border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);border-radius:999px;padding:2px 10px}
/* week dots */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd{font-size:.72em;color:var(--muted)}
.dotd{width:22px;height:22px;border-radius:50%;margin:4px auto 0;border:2px solid var(--line)}
.dotd.on{background:var(--accent);border-color:var(--accent)}
.dotd.pause{border-color:var(--muted);border-style:dashed}
.dotd.today{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.month .dotd{width:100%;height:auto;aspect-ratio:1;border-radius:8px;margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78em;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:2px solid var(--line);display:inline-block}
/* session bar */
.sbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin-bottom:6px}
.bar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width 1s linear}
/* exercise */
.exhead{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.exhead .t{font-family:'DM Serif Display',Georgia,serif;font-size:1.25em;flex:1}
.exhead .p{color:var(--muted);font-size:.85em;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:8px;margin:8px 0}
.cell{appearance:none;aspect-ratio:1;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;font:inherit;font-size:1.25em;font-weight:700;cursor:pointer;transition:background .2s,opacity .3s,border-color .2s;touch-action:manipulation}
.cell.done{opacity:.22}
.cell.lit{background:var(--accent);border-color:var(--accent)}
.cell.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,var(--card2))}
.corsi.watch .cell{cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stage{min-height:220px;border:2px solid var(--line);border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:border-color .15s;margin:6px 0}
.stage.col{flex-direction:column;gap:18px;min-height:200px}
.stage.hit{border-color:var(--ok)}.stage.miss{border-color:var(--bad)}
.sym{font-size:96px;line-height:1}
.stroop{font-size:2.4em;font-weight:700;letter-spacing:.06em}
.digit{font-size:5em;font-weight:700;font-variant-numeric:tabular-nums;min-height:1.2em}
.cmp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2em;letter-spacing:.18em;font-weight:700;min-height:1.3em}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px}
.typed{display:flex;justify-content:center;gap:8px;margin:12px 0;min-height:52px;flex-wrap:wrap}
.typed span{width:42px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:700}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;transition:opacity .2s}
.kpad.off{opacity:.3;pointer-events:none}
.kpad .btn{min-height:58px;font-size:1.3em}
.note{background:#f4efe1;color:#2a2a35;border:none;transform:rotate(-.6deg)}
.note h3{color:#2a2a35}
.note ul{margin:0;padding-left:1.2em;columns:2;font-size:1.1em}
.note li{margin:2px 0}
.boxes{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:14px 0}
.box{width:34px;height:44px;border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.35em;font-weight:700}
.box.on{border-color:var(--accent)}
.boxes.solved .box{color:var(--ok);border-color:var(--ok)}
.def{font-size:1.25em;margin:4px 0 0}
.inp{width:100%;font:inherit;font-size:1.15em;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);outline:none}
.inp:focus{border-color:var(--accent)}
.inp.bad{border-color:var(--bad)}
.slots,.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px 0}
.slot,.tile{appearance:none;width:44px;height:52px;border-radius:12px;font:inherit;font-size:1.35em;font-weight:700;cursor:pointer;touch-action:manipulation}
.slot{border:2px dashed var(--line);background:transparent;color:var(--text)}
.slot.on{border-style:solid;border-color:var(--accent)}
.slots.solved .slot{border-color:var(--ok);color:var(--ok)}
.slots.bad .slot{border-color:var(--bad)}
.tile{border:1px solid var(--line);background:var(--card2);color:var(--text)}
.tile.used{opacity:.15}
.steps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.step{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;padding:12px 14px;border-radius:14px;cursor:pointer;min-height:56px}
.step .num{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.step.on .num{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.good{border-color:var(--ok)}.step.bad{border-color:var(--bad)}
.wchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.wchips .chip.hit{background:color-mix(in srgb,var(--ok) 25%,var(--card2));border-color:var(--ok);color:var(--text)}
.wchips .chip.miss{border-color:var(--ok);border-style:dashed}
.wchips .chip.fa{background:color-mix(in srgb,var(--bad) 22%,var(--card2));border-color:var(--bad);color:var(--text)}
.big-num{font-family:'DM Serif Display',Georgia,serif;font-size:3.2em;line-height:1}
.breath{width:160px;height:160px;border-radius:50%;margin:30px auto;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),color-mix(in srgb,var(--accent) 10%,transparent));transform:scale(.55);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
.breath.out{transform:scale(.55);transition-duration:6s}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.exrow .n{flex:1}
.lvl{display:flex;gap:2px}
.lvl i{width:6px;height:14px;border-radius:2px;background:var(--card2)}
.lvl i.f{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 18px;border-radius:999px;z-index:20;font-size:.9em}
.list-clean{list-style:none;margin:0;padding:0}
.list-clean li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-clean li:last-child{border-bottom:none}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--text)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.sw{appearance:none;width:52px;height:30px;border-radius:30px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:25px;background:var(--on-accent)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stage.split{flex-direction:column;align-items:stretch;padding:0;min-height:260px}
.half{flex:1;display:flex;align-items:center;justify-content:center;font-size:2.6em;font-weight:700;letter-spacing:.1em;min-height:120px}
.half:first-child{border-bottom:2px dashed var(--line)}
body.calm #app{filter:saturate(.5) brightness(.93)}
.warncard{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.taskcard{border-style:dashed}
.bell{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;min-height:54px;padding:0 20px;font-size:1.35em;cursor:pointer;flex:none}
.bell.done{opacity:.4}
.taskwords{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.taskwords span{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:1.25em;font-weight:700}
.stage.pair{gap:18px;flex-wrap:wrap;min-height:200px}
.bridge{font-size:1.6em;font-weight:700;display:flex;gap:10px;align-items:center}
.bridge .q{color:var(--accent)}
.glyph{display:inline-block;font-weight:800;line-height:1}
.grid.model .cell{cursor:default}
.cell.ok{background:color-mix(in srgb,var(--ok) 55%,var(--card2));border-color:var(--ok)}
.cell.miss{border:2px dashed var(--ok)}
.textcard{line-height:1.65;font-size:1.05em}
.textcard h3{margin-bottom:8px}
.peek{margin-top:14px}
.peek summary{cursor:pointer;color:var(--accent);padding:8px 0}
.cell.memo{font-size:1.8em;font-weight:400}
.rw{transition:color .2s}
.rw.ok{color:var(--ok)}
.rw.miss{color:var(--bad);text-decoration:underline dotted}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= Helpers ================= */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a.slice()).slice(0,n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const norm=s=>String(s).toLowerCase().trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z]/g,'');
const up=c=>c==='ß'?'ß':c.toUpperCase();
function dstr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function relDay(ds){const n=daysBetween(ds,dstr());return n===0?'heute':n===1?'gestern':n===2?'vorgestern':new Date(ds).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}
const fmtMin=m=>m<1?'unter 1 Min':Math.round(m)+' Min';
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function h(tag,props,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(props||{})){if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function flash(el,cls,ms=420){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
function toast(t){const e=h('div',{class:'toast'},t);document.body.append(e);setTimeout(()=>e.remove(),2200)}
const app=document.getElementById('app');
function screen(...nodes){app.dataset.screen='';app.innerHTML='';app.append(...nodes.flat(Infinity).filter(x=>x!=null&&x!==false));window.scrollTo(0,0)}
const fine=matchMedia('(pointer:fine)').matches;

/* ================= Speicher ================= */
const KEY='kopfzeit_v1';
const DEF=()=>({checkins:[],sessions:[],levels:{},hist:{},settings:{accent:'#8fb8ff',big:false,maxMin:30,calm:false,tasks:true,useLearned:true,textSrc:'wiki',domains:{conc:true,mem:true,lang:true,plan:true,space:true,math:true,speak:true}}});
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}const d=DEF();if(!s||typeof s!=='object')return d;return{...d,...s,settings:{...d.settings,...(s.settings||{}),domains:{...d.settings.domains,...((s.settings||{}).domains||{})}}}}
let S=load();
function save(){S.checkins=S.checkins.slice(-400);S.sessions=S.sessions.slice(-600);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof schedulePush==='function')schedulePush()}
/* ================= Sync (Firebase) ================= */
const FBKEY='kopfzeit_fb';
const DEVID=(()=>{try{let d=localStorage.getItem('kopfzeit_dev');if(!d){d=Math.random().toString(36).slice(2);localStorage.setItem('kopfzeit_dev',d)}return d}catch(e){return 'x'+Math.random()}})();
let FB=null,fbUser=null,fbState='aus',fbLast=0,pushT=null,pendingRemote=null,applyingRemote=false,fbUnsub=null;
const FB_DEFAULT={apiKey:"AIzaSyCCLKWY3mI6NO40OGJ3fN0rKcIXDllYKCg",authDomain:"kopfzeit-5bb1a.firebaseapp.com",projectId:"kopfzeit-5bb1a",storageBucket:"kopfzeit-5bb1a.firebasestorage.app",messagingSenderId:"786655945539",appId:"1:786655945539:web:3f4dac687bcc6a171ec5f6"};
function fbConf(){let c=null;try{c=JSON.parse(localStorage.getItem(FBKEY))}catch(e){}return c||FB_DEFAULT}
function parseConf(t){let o={};try{o=JSON.parse(t)}catch(e){t.replace(/(\w+)\s*:\s*["']([^"']+)["']/g,(_,k,v)=>{o[k]=v})}return o&&o.apiKey&&o.projectId?o:null}
function fbErr(e){const c=(e&&e.code)||'';return {'auth/invalid-credential':'E-Mail oder Passwort falsch.','auth/wrong-password':'E-Mail oder Passwort falsch.','auth/user-not-found':'Kein Konto mit dieser E-Mail – erst „Konto anlegen“.','auth/email-already-in-use':'Das Konto gibt es schon – bitte „Anmelden“.','auth/weak-password':'Passwort zu kurz (mindestens 6 Zeichen).','auth/invalid-email':'Die E-Mail-Adresse stimmt nicht.','auth/operation-not-allowed':'In Firebase ist „E-Mail/Passwort“ noch nicht aktiviert.','auth/network-request-failed':'Keine Internetverbindung.','permission-denied':'Firestore-Regeln fehlen oder sind falsch.'}[c]||('Fehler: '+(c||e))}
function fbBadge(){const el=document.getElementById('fbb');if(!el)return;el.textContent=fbUser?(fbState==='synchron'?'☁︎ synchronisiert':'☁︎ '+fbState):''}
function syncPayload(){const {textCache,...rest}=S;return JSON.stringify(rest)}
function mergeState(a,b){const m=JSON.parse(JSON.stringify(a));
 const bs=new Map();for(const s of [...(a.sessions||[]),...(b.sessions||[])]){const k=s.id+'|'+s.type,o=bs.get(k);if(!o){bs.set(k,{...s});continue}
  const sBig=(s.items||[]).length>(o.items||[]).length||((s.items||[]).length===(o.items||[]).length&&(s.minutes||0)>(o.minutes||0));const w=sBig?{...o,...s}:{...s,...o};for(const f of ['pem','after','fatigueAt'])if(w[f]==null)w[f]=o[f]!=null?o[f]:s[f];bs.set(k,w)}
 m.sessions=[...bs.values()].sort((x,y)=>x.id-y.id).slice(-600);
 const ci=new Map();for(const c of [...(a.checkins||[]),...(b.checkins||[])])ci.set(c.ts+'|'+c.date,c);m.checkins=[...ci.values()].sort((x,y)=>x.ts-y.ts).slice(-400);
 m.hist={};for(const id of new Set([...Object.keys(a.hist||{}),...Object.keys(b.hist||{})])){const hm=new Map();for(const e of [...((a.hist||{})[id]||[]),...((b.hist||{})[id]||[])])hm.set(e.ts,e);m.hist[id]=[...hm.values()].sort((x,y)=>x.ts-y.ts).slice(-60)}
 m.levels={...(a.levels||{})};m.levelsTs={...(a.levelsTs||{})};for(const [id,v] of Object.entries(b.levels||{})){const tb=(b.levelsTs||{})[id]||0,ta=m.levelsTs[id]||0;if(tb>ta||(m.levels[id]==null)){m.levels[id]=v;m.levelsTs[id]=tb}}
 if((b.settingsTs||0)>(a.settingsTs||0)){m.settings=b.settings;m.settingsTs=b.settingsTs}
 m.seen=[...new Set([...(a.seen||[]),...(b.seen||[])])].slice(-260);m.textCache=a.textCache||[];return m}
function busy(){return !!run||!!(curCtx&&curCtx.alive())}
function applyRemote(remote){const rj=JSON.stringify(remote);applyingRemote=true;S=mergeState(S,remote);const d=DEF();S.settings={...d.settings,...S.settings,domains:{...d.settings.domains,...(S.settings.domains||{})}};save();applyingRemote=false;applySettings();
 if(syncPayload()!==rj)fbPush();if(app.dataset.screen==='home')home()}
async function fbPush(){if(!FB||!fbUser)return;try{await FB.fs.setDoc(FB.fs.doc(FB.db,'kopfzeit',fbUser.uid),{data:syncPayload(),dev:DEVID,upd:Date.now()});fbState='synchron';fbLast=Date.now()}catch(e){fbState=e&&e.code==='permission-denied'?fbErr(e):'offline – wird nachgeholt'}fbBadge()}
function schedulePush(){if(!fbUser||applyingRemote)return;clearTimeout(pushT);pushT=setTimeout(fbPush,1500)}
function fbListen(){if(fbUnsub)fbUnsub();fbState='verbinde …';fbBadge();
 fbUnsub=FB.fs.onSnapshot(FB.fs.doc(FB.db,'kopfzeit',fbUser.uid),snap=>{if(snap.metadata&&snap.metadata.hasPendingWrites)return;const d=snap.exists()?snap.data():null;
